name: Build DSL-AC68U (386.12 + Repeater mode)
run-name: "DSL-AC68U repeater build"

# Builds GNUton's 386.12 Merlin firmware for the DSL-AC68U with the
# Operation Mode / Repeater UI enabled. Adapted from the CircleCI job
# GNUton used for the 386.x DSL-AC68U releases.

on:
  push:
    branches: [dsl-ac68u-repeater]
  workflow_dispatch:

permissions:
  contents: write # lets the job push the build log to the build-logs branch

jobs:
  build:
    name: Build dsl-ac68u
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container:
      # Runs as root so the runner can write its own files; the build
      # itself runs as the image's "docker" user (see AS_DOCKER below).
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      volumes:
        - /mnt:/project # /mnt is the large partition on GitHub runners
    env:
      PROJECT_DIR: /project/asuswrt-merlin.ng
      RELEASE_DIR: src-rt-6.x.4708
      MODEL: dsl-ac68u
      FW_EXTENDNO: 0-gnuton1-repeater
      ARTIFACTS_DIR: /project/artifacts
      AS_DOCKER: sudo -E -H -u docker bash -eo pipefail -c
    steps:
      - name: Disk space
        run: df -h

      - name: Prepare workspace
        run: |
          chown -R docker:docker /home/docker /project
          git config --system --add safe.directory '*'

      - name: Fetch code
        run: |
          $AS_DOCKER '
            cd /project
            git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" asuswrt-merlin.ng
            cd asuswrt-merlin.ng && git log -1 --oneline
          '

      - name: Set version
        run: |
          $AS_DOCKER '
            cd ${PROJECT_DIR}
            sed -i "s/^EXTENDNO=.*/EXTENDNO=${FW_EXTENDNO}/" release/src-rt/version.conf
            cat release/src-rt/version.conf
          '

      - name: Set up ARM toolchain
        run: |
          ln -sfn /home/docker/am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3 /opt/brcm-arm
          $AS_DOCKER '
            rm -rf ${PROJECT_DIR}/release/${RELEASE_DIR}/toolchains
            ln -sfn /home/docker/am-toolchains/brcm-arm-sdk ${PROJECT_DIR}/release/${RELEASE_DIR}/toolchains
          '
          ls -la /opt/brcm-arm/bin | head

      - name: Build firmware
        run: |
          $AS_DOCKER '
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:/opt/brcm-arm/lib"
            export PATH="${PATH}:/opt/brcm-arm/bin"
            export MERLINUPDATE=y
            cd ${PROJECT_DIR}/release/${RELEASE_DIR}
            make ${MODEL} 2>&1 | tee /project/build.log
            echo "------ DONE -----"
            ls -la image/
          '

      - name: Summarise errors (on failure)
        if: failure()
        run: |
          grep -n -i -E "error|\*\*\*|undefined reference|No such file" /project/build.log \
            | grep -v -i -E "werror|error\.o|error\.c|-Wno-error|strerror|perror|error_page" \
            | tail -60 > /project/errors.txt || true
          echo "===== Error lines ====="; cat /project/errors.txt
          echo "===== Last 150 lines ====="; tail -150 /project/build.log || true
          tail -8 /project/errors.txt | while IFS= read -r l; do echo "::error title=build::${l:0:900}"; done

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p ${ARTIFACTS_DIR}
          IMAGE_PATH=${PROJECT_DIR}/release/${RELEASE_DIR}/image
          for f in ${IMAGE_PATH}/*.trx; do
            [ -f "$f" ] || continue
            cp "$f" ${ARTIFACTS_DIR}/
            (cd ${ARTIFACTS_DIR} && md5sum "$(basename "$f")" > "$(basename "$f").md5")
          done
          cp /project/build.log ${ARTIFACTS_DIR}/dsl-ac68u-build.log 2>/dev/null || true
          ls -la ${ARTIFACTS_DIR}

      - name: Publish build log to build-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          D=/project/logs-branch; rm -rf $D; mkdir -p $D; cd $D
          git init -q && git checkout -q -b build-logs
          cp /project/build.log ./build.log 2>/dev/null || echo "no build.log" > build.log
          cp /project/errors.txt ./errors.txt 2>/dev/null || true
          ls -la ${ARTIFACTS_DIR} > artifacts.txt 2>&1
          echo "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} sha ${GITHUB_SHA}" > run.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "build log for run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs

      - name: Upload firmware and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSL-AC68U-386.12-repeater
          path: /project/artifacts
          retention-days: 90
