name: Build DSL-AC68U (386.12 + Repeater mode)
run-name: "DSL-AC68U repeater build"

# Builds GNUton's 386.12 Merlin firmware for the DSL-AC68U with the
# Operation Mode / Repeater UI enabled. Adapted from the CircleCI job
# GNUton used for the 386.x DSL-AC68U releases.
#
# The container runs as root (so the runner can write its own files);
# the build itself runs as the image's "docker" user via run_as_docker.
# On any failure the last lines of output are posted as an annotation.

on:
  push:
    branches: [dsl-ac68u-repeater]
  workflow_dispatch:

permissions:
  contents: write # lets the job push the build log to the build-logs branch

jobs:
  build:
    name: Build dsl-ac68u
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      volumes:
        - /mnt:/project # /mnt is the large partition on GitHub runners
    defaults:
      run:
        shell: bash
    env:
      PROJECT_DIR: /project/asuswrt-merlin.ng
      RELEASE_DIR: src-rt-6.x.4708
      MODEL: dsl-ac68u
      FW_EXTENDNO: 0-gnuton1-repeater
      ARTIFACTS_DIR: /project/artifacts
      HELPER: /project/ci-helper.sh
    steps:
      - name: Prepare workspace
        run: |
          set -eo pipefail
          df -h
          mkdir -p /project
          # Values the docker user needs (sudo drops the environment)
          cat > /project/ci-env.sh <<EOF
          export PROJECT_DIR="${PROJECT_DIR}"
          export RELEASE_DIR="${RELEASE_DIR}"
          export MODEL="${MODEL}"
          export FW_EXTENDNO="${FW_EXTENDNO}"
          export REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          export BRANCH="${GITHUB_REF_NAME}"
          export HOME=/home/docker
          export LD_LIBRARY_PATH="/opt/brcm-arm/lib"
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/brcm-arm/bin"
          export MERLINUPDATE=y
          EOF
          cat > "${HELPER}" <<'EOF'
          # step NAME CMD... : run CMD, keep its output, annotate on failure
          step() {
            local name="$1"; shift
            local log="/project/step-${name}.log"
            set +e
            ( "$@" ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              local msg
              msg=$(tail -25 "$log" | cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=${name} failed (exit ${rc})::${msg}"
              exit "$rc"
            fi
          }
          # run_as_docker 'shell code' : run code as the docker user with ci-env.sh loaded
          run_as_docker() {
            sudo -H -u docker bash -eo pipefail -c "source /project/ci-env.sh; $1"
          }
          EOF
          cat /project/ci-env.sh
          chown -R docker:docker /home/docker /project
          id docker

      - name: Fetch code
        run: |
          source "$HELPER"
          step fetch run_as_docker '
            cd /project
            rm -rf asuswrt-merlin.ng
            git clone --depth 1 --branch "$BRANCH" "$REPO_URL" asuswrt-merlin.ng
            cd asuswrt-merlin.ng && git log -1 --oneline
          '

      - name: Set version and toolchain
        run: |
          source "$HELPER"
          ln -sfn /home/docker/am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3 /opt/brcm-arm
          step setup run_as_docker '
            cd "$PROJECT_DIR"
            sed -i "s/^EXTENDNO=.*/EXTENDNO=${FW_EXTENDNO}/" release/src-rt/version.conf
            grep -E "SERIALNO|EXTENDNO" release/src-rt/version.conf
            rm -rf "release/$RELEASE_DIR/toolchains"
            ln -sfn /home/docker/am-toolchains/brcm-arm-sdk "release/$RELEASE_DIR/toolchains"
            ls /opt/brcm-arm/bin | head -5
            arm-brcm-linux-uclibcgnueabi-gcc --version | head -1 || arm-linux-gcc --version | head -1 || true
          '

      - name: Build firmware
        run: |
          source "$HELPER"
          step build run_as_docker '
            cd "$PROJECT_DIR/release/$RELEASE_DIR"
            make "$MODEL" > /project/build.log 2>&1 || {
              echo "make failed; error lines:"
              grep -n -E "Error [0-9]+|error:|\*\*\*|undefined reference|No such file or directory" /project/build.log | tail -20
              exit 1
            }
            echo "------ DONE -----"
            ls -la image/
          '

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p ${ARTIFACTS_DIR}
          IMAGE_PATH=${PROJECT_DIR}/release/${RELEASE_DIR}/image
          for f in ${IMAGE_PATH}/*.trx; do
            [ -f "$f" ] || continue
            cp "$f" ${ARTIFACTS_DIR}/
            (cd ${ARTIFACTS_DIR} && md5sum "$(basename "$f")" > "$(basename "$f").md5")
          done
          cp /project/build.log ${ARTIFACTS_DIR}/dsl-ac68u-build.log 2>/dev/null || true
          ls -la ${ARTIFACTS_DIR}

      - name: Publish build log to build-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$HELPER"
          D=/project/logs-branch; rm -rf $D; mkdir -p $D; cd $D
          git init -q && git checkout -q -b build-logs
          cp /project/build.log . 2>/dev/null || echo "no build.log" > build.log
          cp /project/step-*.log . 2>/dev/null || true
          ls -la ${ARTIFACTS_DIR} > artifacts.txt 2>&1 || true
          echo "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} sha ${GITHUB_SHA}" > run.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "build log for run ${GITHUB_RUN_ID}"
          step publish git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs

      - name: Upload firmware and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSL-AC68U-386.12-repeater
          path: /project/artifacts
          retention-days: 90
